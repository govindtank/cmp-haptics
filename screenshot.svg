<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" style="background:#0b0f19;border-radius:16px;">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="hapticWave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="420" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5"/>
  <circle cx="700" cy="80" r="180" fill="url(#glowGrad)"/>
  <circle cx="100" cy="350" r="150" fill="url(#glowGrad)"/>

  <!-- Header Section -->
  <g transform="translate(40, 35)">
    <rect x="0" y="0" width="160" height="24" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="12" y="16" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="11" font-weight="600" fill="#34d399">COMPOSE MULTIPLATFORM</text>
    <text x="0" y="52" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="24" font-weight="800" fill="#f8fafc" letter-spacing="-0.5">cmp-haptics</text>
    <text x="0" y="74" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="13" fill="#94a3b8">Modern Material You &amp; CoreHaptics Tactile Feedback Engine</text>
  </g>

  <!-- Left Card: Tactile Waveform Mockup -->
  <g transform="translate(40, 130)" filter="url(#cardShadow)">
    <rect width="320" height="240" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2"/>
    
    <circle cx="20" cy="20" r="5" fill="#ef4444" opacity="0.8"/>
    <circle cx="36" cy="20" r="5" fill="#eab308" opacity="0.8"/>
    <circle cx="52" cy="20" r="5" fill="#22c55e" opacity="0.8"/>
    <text x="75" y="24" font-family="monospace" font-size="11" fill="#64748b">TactileWaveform.kt</text>

    <!-- Waveform animation illustration -->
    <g transform="translate(30, 70)">
      <!-- Wave grid lines -->
      <line x1="0" y1="40" x2="260" y2="40" stroke="#334155" stroke-width="1" stroke-dasharray="4,4"/>
      
      <!-- Tactile Waveform Path -->
      <path d="M 0 40 Q 25 40, 35 15 T 55 65 T 75 40 L 110 40 Q 125 40, 135 5 T 155 75 T 175 40 L 210 40 Q 220 40, 230 20 T 250 40" 
            fill="none" stroke="url(#hapticWave)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
      
      <!-- Tactile Pulse Points -->
      <circle cx="45" cy="40" r="5" fill="#10b981" filter="url(#glow)"/>
      <circle cx="145" cy="40" r="6" fill="#06b6d4" filter="url(#glow)"/>
      <circle cx="230" cy="40" r="4" fill="#3b82f6"/>
    </g>

    <text x="160" y="175" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="14" font-weight="700" fill="#f8fafc">HapticFeedbackType.SUCCESS</text>
    <text x="160" y="198" text-anchor="middle" font-family="monospace" font-size="11" fill="#34d399">Dual Pulse Waveform Synchronized</text>
  </g>

  <!-- Right Side: Architecture & Features -->
  <g transform="translate(390, 130)" filter="url(#cardShadow)">
    <rect width="370" height="240" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2"/>
    
    <text x="24" y="32" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="13" font-weight="700" fill="#34d399" letter-spacing="1">SYNCHRONIZED HAPTIC PIPELINE</text>

    <!-- Box 1: Modifier Extension -->
    <g transform="translate(24, 46)">
      <rect width="322" height="42" rx="8" fill="#0f172a" stroke="#059669" stroke-width="1"/>
      <text x="14" y="25" font-family="monospace" font-size="12" font-weight="600" fill="#f8fafc">Modifier.hapticClickable { }</text>
      <rect x="250" y="12" width="60" height="18" rx="4" fill="#047857"/>
      <text x="280" y="24" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#fff">COMPOSE</text>
    </g>

    <!-- Flow Arrows -->
    <path d="M100 95 L100 110 M260 95 L260 110" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="3,3"/>

    <!-- Box 2: Android Vibrator -->
    <g transform="translate(24, 115)">
      <rect width="154" height="60" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="12" y="24" font-family="-apple-system,sans-serif" font-size="12" font-weight="700" fill="#4ade80">Android</text>
      <text x="12" y="44" font-family="monospace" font-size="10" fill="#94a3b8">VibratorManager (API 31+)</text>
    </g>

    <!-- Box 3: iOS CoreHaptics -->
    <g transform="translate(192, 115)">
      <rect width="154" height="60" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="12" y="24" font-family="-apple-system,sans-serif" font-size="12" font-weight="700" fill="#a78bfa">iOS (Apple)</text>
      <text x="12" y="44" font-family="monospace" font-size="10" fill="#94a3b8">UIFeedbackGenerator</text>
    </g>

    <!-- Footer Author Tag -->
    <line x1="24" y1="192" x2="346" y2="192" stroke="#334155" stroke-width="0.8"/>
    <text x="24" y="215" font-family="-apple-system,sans-serif" font-size="11" fill="#94a3b8">Architected &amp; Crafted by <tspan fill="#34d399" font-weight="700">Govind Tank</tspan></text>
    <text x="346" y="215" text-anchor="end" font-family="monospace" font-size="11" fill="#64748b">v1.0.0</text>
  </g>
</svg>
